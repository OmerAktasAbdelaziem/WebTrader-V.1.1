<!DOCTYPE html>
<html>
    <head>
        <title>Bank Details Copy Test</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
    </head>
    <body>
        <div class="container mt-5">
            <h3>Bank Details Copy Test</h3>
            <div class="card border-primary">
                <div class="card-header bg-primary text-white">
                    <h6 class="mb-0">
                        <i
                            class="iconify me-2"
                            data-icon="material-symbols:account-balance"
                        ></i>
                        Bank Details
                    </h6>
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-12">
                            <div class="bank-detail-item">
                                <label class="form-label fw-bold text-primary"
                                    >Bank Name</label
                                >
                                <div class="input-group">
                                    <input
                                        type="text"
                                        class="form-control"
                                        value="Test Bank"
                                        readonly
                                        id="bank_name_field"
                                    />
                                    <button
                                        class="btn btn-outline-secondary btn-sm"
                                        type="button"
                                        onclick="copyToClipboard('bank_name_field', this)"
                                    >
                                        <i
                                            class="iconify"
                                            data-icon="material-symbols:content-copy"
                                        ></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="bank-detail-item">
                                <label class="form-label fw-bold text-primary"
                                    >Account Number</label
                                >
                                <div class="input-group">
                                    <input
                                        type="text"
                                        class="form-control"
                                        value="123456789"
                                        readonly
                                        id="account_number_field"
                                    />
                                    <button
                                        class="btn btn-outline-secondary btn-sm"
                                        type="button"
                                        onclick="copyToClipboard('account_number_field', this)"
                                    >
                                        <i
                                            class="iconify"
                                            data-icon="material-symbols:content-copy"
                                        ></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="mt-3">
                        <button
                            type="button"
                            class="btn btn-outline-primary btn-sm"
                            onclick="copyAllBankDetails()"
                        >
                            <i
                                class="iconify me-1"
                                data-icon="material-symbols:content-copy"
                            ></i>
                            Copy All Details
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <script>
            // Mock bank data for testing
            window.currentBankData = {
                name: "Test Bank",
                account_number: "123456789",
                beneficiary_name: "Test Beneficiary",
                iban: "TEST123456789",
                swift_code: "TESTSWFT",
                bic: "TESTBIC",
                address: "123 Test Street, Test City",
            };

            function copyToClipboard(fieldId, button) {
                const field = document.getElementById(fieldId);
                if (!field) return;

                const value = field.value || field.textContent;
                if (!value || value === "N/A") {
                    alert("No data to copy");
                    return;
                }

                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard
                        .writeText(value)
                        .then(function () {
                            showCopySuccess(button);
                        })
                        .catch(function () {
                            fallbackCopyToClipboard(value, button);
                        });
                } else {
                    fallbackCopyToClipboard(value, button);
                }
            }

            function copyAllBankDetails() {
                if (!window.currentBankData) {
                    alert("No bank details to copy");
                    return;
                }

                const data = window.currentBankData;
                let allDetails = `Bank Details:\n`;
                allDetails += `Bank Name: ${data.name}\n`;
                if (data.account_number)
                    allDetails += `Account Number: ${data.account_number}\n`;
                if (data.beneficiary_name)
                    allDetails += `Beneficiary Name: ${data.beneficiary_name}\n`;
                if (data.iban) allDetails += `IBAN: ${data.iban}\n`;
                if (data.swift_code)
                    allDetails += `SWIFT Code: ${data.swift_code}\n`;
                if (data.bic) allDetails += `BIC: ${data.bic}\n`;
                if (data.address) allDetails += `Address: ${data.address}\n`;

                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard
                        .writeText(allDetails)
                        .then(function () {
                            alert("All bank details copied to clipboard!");
                        })
                        .catch(function () {
                            fallbackCopyToClipboard(allDetails);
                        });
                } else {
                    fallbackCopyToClipboard(allDetails);
                }
            }

            function fallbackCopyToClipboard(text, button) {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                textArea.style.top = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();

                try {
                    const successful = document.execCommand("copy");
                    if (successful) {
                        if (button) {
                            showCopySuccess(button);
                        } else {
                            alert("Copied to clipboard!");
                        }
                    } else {
                        alert("Failed to copy to clipboard");
                    }
                } catch (err) {
                    console.error("Copy failed:", err);
                    alert("Failed to copy to clipboard");
                } finally {
                    document.body.removeChild(textArea);
                }
            }

            function showCopySuccess(button) {
                const originalHtml = button.innerHTML;
                button.innerHTML =
                    '<i class="iconify" data-icon="material-symbols:check"></i>';
                button.classList.add("btn-success");
                button.classList.remove("btn-outline-secondary");

                setTimeout(function () {
                    button.innerHTML = originalHtml;
                    button.classList.remove("btn-success");
                    button.classList.add("btn-outline-secondary");
                }, 2000);

                alert("Copied!");
            }
        </script>
    </body>
</html>
